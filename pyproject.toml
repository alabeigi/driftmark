[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "driftmark"
version = "0.1.0"
description = "Record a directory's contents and see what changed."
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
driftmark = "driftmark.cli:main"

[tool.setuptools]
packages = ["driftmark"]
